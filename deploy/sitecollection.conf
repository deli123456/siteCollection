# 位置点采集 - HTTPS 站点 (443)，不影响已有 80 端口站点
server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  47.93.38.162;

    ssl_certificate      /etc/nginx/ssl/sitecollection.crt;
    ssl_certificate_key  /etc/nginx/ssl/sitecollection.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;

    root   /var/www/sitecollection;
    index  index.html;

    # 定位相关权限策略，允许地理定位
    add_header Permissions-Policy "geolocation=(self)" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }
}
